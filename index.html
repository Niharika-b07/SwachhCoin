<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SwachhCoin - Civic Clean-to-Earn Portal</title>
    <!-- Leaflet CSS for India Interactive Map -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <!-- Tailwind CDN guarantees styles render immediately in dev and production -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                green: "#10B981",
                dark: "#065F46",
                accent: "#3B82F6"
              }
            }
          }
        }
      }
    </script>
    <style>
      /* Fallback baseline styles */
      body {
        margin: 0;
        padding: 0;
        background-color: #020617;
        color: #f8fafc;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        min-height: 100vh;
      }
      /* Leaflet custom popup styling */
      .leaflet-popup-content-wrapper {
        background: rgba(15, 23, 42, 0.95) !important;
        color: #fff !important;
        border-radius: 1rem !important;
        border: 1px solid rgba(255, 255, 255, 0.2) !important;
        backdrop-filter: blur(12px) !important;
        box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5) !important;
      }
      .leaflet-popup-tip {
        background: rgba(15, 23, 42, 0.95) !important;
      }
    </style>
  </head>
  <body class="bg-slate-950 text-white min-h-screen m-0 p-0 antialiased overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
